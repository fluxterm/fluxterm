[package]
name = "engine"
version.workspace = true
edition.workspace = true
authors.workspace = true

[features]
default = []
performance-telemetry = ["dep:fluxterm-performance-telemetry"]

[dependencies]
fluxterm-logging = { workspace = true }
fluxterm-performance-telemetry = { workspace = true, optional = true }

anyhow = { version = "1.0.102" }
serde = { workspace = true, features = ["derive"] }
russh = { workspace = true }
russh-sftp = { version = "2.1.1" }
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "time", "io-util", "sync", "macros"] }
uuid = { workspace = true, features = ["v4"] }
log= { workspace = true }
regex = { version = "1.12.3" }
futures-util = { version = "0.3.32" }
base64 = { version = "0.22.1" }
serde_json = { workspace = true }
tokio-serial = "5.4.5"
encoding_rs = "0.8.35"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_IO"] }
