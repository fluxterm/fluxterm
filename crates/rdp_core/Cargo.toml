[package]
name = "fluxterm-rdp-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish = false
description = "FluxTerm RDP in-process runtime"

[features]
default = []
performance-telemetry = ["dep:fluxterm-performance-telemetry"]

[dependencies]
fluxterm-logging = { workspace = true }
fluxterm-performance-telemetry = { workspace = true, optional = true }

axum = { version = "0.8.4", features = ["http1", "json", "tokio", "ws"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
log = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
thiserror = "2.0.18"
hostname = "0.4.1"
base64 = "0.22.1"
png = "0.17.16"
cpal = "0.17.3"
ironrdp = { git = "https://github.com/Devolutions/IronRDP", rev = "f6391452da15cd7cf9896f095b0df2909593ccc0", features = ["session", "input", "graphics", "dvc", "svc", "displaycontrol", "connector", "rdpdr", "rdpsnd"] }
ironrdp-tls = { git = "https://github.com/Devolutions/IronRDP", rev = "f6391452da15cd7cf9896f095b0df2909593ccc0", package = "ironrdp-tls", features = ["rustls"] }
ironrdp-tokio = { git = "https://github.com/Devolutions/IronRDP", rev = "f6391452da15cd7cf9896f095b0df2909593ccc0", package = "ironrdp-tokio", features = ["reqwest"] }
ironrdp-cliprdr = { git = "https://github.com/Devolutions/IronRDP", rev = "f6391452da15cd7cf9896f095b0df2909593ccc0", package = "ironrdp-cliprdr" }

ironrdp-egfx = { git = "https://github.com/Devolutions/IronRDP", rev = "f6391452da15cd7cf9896f095b0df2909593ccc0" }
openh264 = { version = "0.9", default-features = false, features = ["source"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "rect_merge_bench"
harness = false

[[bench]]
name = "frame_message_bench"
harness = false

[[bench]]
name = "overdraw_policy_bench"
harness = false

[[bench]]
name = "bridge_binary_bench"
harness = false
