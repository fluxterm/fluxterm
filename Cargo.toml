[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/*",
]

[workspace.package]
version = "0.10.0"
edition = "2024"
authors = ["sfwwslm"]

[workspace.dependencies]
fluxterm-engine = { path = "crates/engine" }
fluxterm-openai = { path = "crates/openai" }
fluxterm-logging = { path = "crates/logging" }
fluxterm-performance-telemetry = { path = "crates/performance_telemetry" }
fluxterm-pulse-protocol = { git = "https://github.com/fluxterm/fluxterm-pulse-protocol.git", tag = "0.1.0" }

log = { version = "0.4.29" }
serde = { version = "1.0.228", features = ["derive"] }
dotenvy = { version = "0.15.7" }
tokio = { version = "1.50.0" }
uuid = { version = "=1.23.2" }
serde_json = { version = "1.0.149" }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
russh = { version = "0.63.2", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-config = { version = "0.58.0" }
russh-sftp = { version = "3.0.0" }

[patch.crates-io]
sspi = { version = "=0.21.3", git = "https://github.com/fluxterm/sspi-rs", branch = "codex/compat-russh-0632" }
picky = { version = "=7.0.0-rc.26", git = "https://github.com/fluxterm/picky-rs", branch = "codex/compat-russh-0632" }
picky-asn1 = { version = "=0.10.1", git = "https://github.com/fluxterm/picky-rs", branch = "codex/compat-russh-0632" }
picky-asn1-der = { version = "=0.5.6", git = "https://github.com/fluxterm/picky-rs", branch = "codex/compat-russh-0632" }
picky-asn1-x509 = { version = "=0.15.4", git = "https://github.com/fluxterm/picky-rs", branch = "codex/compat-russh-0632" }
picky-krb = { version = "=0.12.4", git = "https://github.com/fluxterm/picky-rs", branch = "codex/compat-russh-0632" }

[profile.dev]
incremental = true

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"

[profile.fast-release]
inherits = "release"
lto = false
strip = false
codegen-units = 256
opt-level = 3
