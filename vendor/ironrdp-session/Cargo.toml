[package]
name = "ironrdp-session"
version = "0.11.0"
readme = "README.md"
description = "State machines to drive an RDP session"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Devolutions/IronRDP"
repository = "https://github.com/Devolutions/IronRDP"
authors = ["Devolutions Inc. <infos@devolutions.net>", "Teleport <goteleport.com>"]
keywords = ["rdp", "remote-desktop", "network", "client", "protocol"]
categories = ["network-programming"]

[lib]
doctest = false
test = false

[features]
default = []
qoi = ["dep:qoicoubeh", "ironrdp-pdu/qoi"]
qoiz = ["dep:zstd-safe", "qoi"]
__test = ["dep:visibility"]

[dependencies]
ironrdp-bulk = { git = "https://github.com/Devolutions/IronRDP", rev = "f6391452da15cd7cf9896f095b0df2909593ccc0", version = "0.1" } # public
ironrdp-core = { git = "https://github.com/Devolutions/IronRDP", rev = "f6391452da15cd7cf9896f095b0df2909593ccc0", version = "0.2" } # public
ironrdp-svc = { git = "https://github.com/Devolutions/IronRDP", rev = "f6391452da15cd7cf9896f095b0df2909593ccc0", version = "0.8" } # public
ironrdp-dvc = { git = "https://github.com/Devolutions/IronRDP", rev = "f6391452da15cd7cf9896f095b0df2909593ccc0", version = "0.8" } # public
ironrdp-error = { git = "https://github.com/Devolutions/IronRDP", rev = "f6391452da15cd7cf9896f095b0df2909593ccc0", version = "0.2" } # public
ironrdp-graphics = { git = "https://github.com/Devolutions/IronRDP", rev = "f6391452da15cd7cf9896f095b0df2909593ccc0", version = "0.9" } # public
ironrdp-pdu = { git = "https://github.com/Devolutions/IronRDP", rev = "f6391452da15cd7cf9896f095b0df2909593ccc0", version = "0.9", features = ["std"] } # public
ironrdp-displaycontrol = { git = "https://github.com/Devolutions/IronRDP", rev = "f6391452da15cd7cf9896f095b0df2909593ccc0", version = "0.8" }
ironrdp-egfx = { git = "https://github.com/Devolutions/IronRDP", rev = "f6391452da15cd7cf9896f095b0df2909593ccc0", version = "0.3" }
ironrdp-rdpei = { git = "https://github.com/Devolutions/IronRDP", rev = "f6391452da15cd7cf9896f095b0df2909593ccc0", version = "0.1" }
tracing = { version = "0.1", features = ["log"] }
qoicoubeh = { version = "0.5", optional = true }
zstd-safe = { version = "7.2", optional = true, features = ["std"] }
visibility = { version = "0.1", optional = true }

[workspace]
